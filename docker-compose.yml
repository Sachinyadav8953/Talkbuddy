version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: talkbuddy_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: talkbuddy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: talkbuddy_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root1
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=Talkbuddy
      - OLLAMA_URL=http://host.docker.internal:11434
      - WHISPER_MODEL=base
      - WHISPER_DEVICE=cpu
    depends_on:
      - db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/models:/app/models
      - ./backend/piper_bin:/app/piper_bin
      - ./backend/temp_audio:/app/temp_audio

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: talkbuddy_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
